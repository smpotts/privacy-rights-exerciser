[project]
name = "privacy-rights-exerciser"
version = "0.1.0"
description = "A simple app to find the privacy policy and draft email for personal data deletion."
readme = "README.md"
authors = [
    { name = "Shelby Potts" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "flask>=3.1.3",
    "requests>=2.34.2",
]

[project.scripts]
privacy-rights-exerciser = "privacy_rights_exerciser:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
